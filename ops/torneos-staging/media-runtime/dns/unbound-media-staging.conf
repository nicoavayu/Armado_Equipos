# Arma2 Torneos · Multimedia Staging host resolver policy.
#
# TEMPLATE. Not applied. Destination: /etc/unbound/unbound.conf.d/ on the future
# Staging VM, under its own authorization.
#
# ---------------------------------------------------------------------------
# What this layer is, and what it is NOT
# ---------------------------------------------------------------------------
# It is not the guarantee. The guarantee that this host cannot reach Production
# is workers/tournament-media-processor/src/target.mjs and the renewer's
# forbidden-targets.mjs: Production's ref is COMPILED IN as forbidden, the
# environment can only add to that list and never subtract from it, and every
# request URL is re-validated against a frozen descriptor immediately before the
# credential goes out. Reaching Production from this host is a reviewed source
# change, not a DNS entry.
#
# This file is the layer under it, and it buys exactly one thing: a name that
# should never be looked up here returns NXDOMAIN instead of an address, so a
# hypothetical future caller that skips the code guard gets no A record. It
# stops nothing that connects by IP literal — for that, the code guard refuses
# any host that is not `<authorized-ref>.supabase.co`, which an IP never is.
#
# ---------------------------------------------------------------------------
# Why no /etc/hosts and no pinned addresses
# ---------------------------------------------------------------------------
# The rejected alternative was an /etc/hosts entry mapping the Staging host to a
# fixed IP. Supabase sits behind Cloudflare: those addresses are anycast, they
# rotate, and pinning one converts a routine upstream change into an outage that
# looks like a code bug. A hosts entry also cannot express "this name must not
# resolve" — 127.0.0.1 is an ANSWER, so a client would connect to the loopback
# and read whatever is listening there rather than fail. `always_nxdomain` says
# the thing that is actually meant.
#
# ---------------------------------------------------------------------------
# THE DOCKER TRAP, which this file only half fixes
# ---------------------------------------------------------------------------
# When /etc/resolv.conf on the host lists a LOOPBACK nameserver, dockerd does
# not pass it to containers — a container's 127.0.0.1 is its own namespace, so
# the address would be meaningless. dockerd DISCARDS the loopback entries and
# substitutes public resolvers (8.8.8.8, 8.8.4.4). A stack configured this way
# looks correct on the host, and every container resolves around the policy.
#
# The other half of the fix is therefore in docker-compose.staging.yml: each
# service sets `dns:` to the gateway address of its own egress bridge, which is
# this host, on a non-loopback address. Which is why unbound must listen on
# those gateway addresses and accept queries from those subnets.
#
# ---------------------------------------------------------------------------
# Behaviour when this resolver is DOWN or SERVFAILs
# ---------------------------------------------------------------------------
# Nothing degrades open. Resolution fails, so:
#   - the processor's HTTPS requests fail; the job it holds is not completed,
#     its lease expires after 300s and the job returns to the queue;
#   - the renewer's cycle fails and is retried with backoff. If failures
#     continue past the 900s safety margin the 3600s attestation expires,
#     `tournament_media_pipeline_readiness()` closes and `uploadReady` goes
#     false. Uploads stop. That is the designed fail-closed outcome, not an
#     incident to route around;
#   - freshclam cannot update. clamd keeps serving the signatures already in
#     the clamav-db volume; once they pass 7 days the worker's own
#     TOURNAMENT_MEDIA_CLAMD_MAX_SIGNATURE_AGE_DAYS check fails and it stops
#     certifying scans.
# A resolver outage therefore stops work. It never widens what is reachable.

server:
  # Linux IP_FREEBIND lets Unbound create only these explicit listening sockets
  # before Docker creates the bridge gateway addresses. When the bridges appear,
  # the same addresses become usable; this does not widen the listen set.
  ip-freebind: yes
  # Loopback for host processes, plus the bridge gateway of each egress network
  # declared in docker-compose.staging.yml. These are the addresses the
  # containers' `dns:` entries point at.
  interface: 127.0.0.1
  interface: 172.31.20.17
  interface: 172.31.20.33
  interface: 172.31.20.49

  # Only this host and the three egress subnets. media-internal (172.31.20.0/28)
  # is deliberately absent: it is an `internal` network with no route here.
  access-control: 0.0.0.0/0 refuse
  access-control: 127.0.0.0/8 allow
  access-control: 172.31.20.16/28 allow
  access-control: 172.31.20.32/28 allow
  access-control: 172.31.20.48/28 allow

  do-not-query-localhost: yes
  hide-identity: yes
  hide-version: yes
  qname-minimisation: yes
  harden-glue: yes
  harden-dnssec-stripped: yes
  val-permissive-mode: no

  # -------------------------------------------------------------------------
  # THE POLICY LINE
  # -------------------------------------------------------------------------
  # Production, ref rcyuuoaqfwcembdajcss, does not resolve on this host. The
  # zone form covers the apex and every subdomain under it in one statement, so
  # `db.`, `api.` and any future prefix are covered without enumerating them.
  local-zone: "rcyuuoaqfwcembdajcss.supabase.co." always_nxdomain

  # Staging resolves normally, through the ordinary upstream path below. It is
  # named here as a comment rather than as a `local-data` override precisely
  # because it must follow real DNS, including Supabase's own failovers:
  #   hhyvmhgpapyuzjgxfnqv.supabase.co  -> resolved upstream, not pinned

  cache-min-ttl: 60
  # Bounded so a Cloudflare address change is picked up within the hour rather
  # than held until a restart.
  cache-max-ttl: 3600

forward-zone:
  name: "."
  forward-tls-upstream: yes
  # DNS-over-TLS to two independent operators. The host firewall allows tcp/853
  # to these and udp/53 to nothing, so a container that ignores its `dns:`
  # setting and queries a public resolver directly is dropped rather than
  # answered.
  forward-addr: 1.1.1.1@853#cloudflare-dns.com
  forward-addr: 9.9.9.9@853#dns.quad9.net
