name: arma2-core-lab
# Core-only local lab (security/stability/UX review). REAL Core schema
# (supabase/migrations applied as `postgres`), real GoTrue (magic links land in
# a local Mailpit — nothing leaves this machine), PostgREST, storage-api,
# Realtime and the user-facing Core Edge Functions on edge-runtime.
# Only `core-api` (Kong substitute) and the Mailpit UI are published, on loopback.
# Push functions are NOT mounted: the lab cannot deliver real notifications.
services:
  core-db:
    image: public.ecr.aws/supabase/postgres:17.6.1.143
    command: [postgres, -D, /etc/postgresql, -c, log_statement=none, -c, log_min_error_statement=panic, -c, log_parameter_max_length_on_error=0]
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?generated by lab.mjs}
    volumes:
      - core-data:/var/lib/postgresql/data
      - ./core-init.sql:/docker-entrypoint-initdb.d/zz-core-lab.sql:ro
    networks: [isolated]
    healthcheck:
      test: [CMD, pg_isready, -U, postgres]
      interval: 2s
      timeout: 2s
      retries: 40
  mailpit:
    image: public.ecr.aws/supabase/mailpit:v1.30.2
    ports: ["127.0.0.1:58531:8025"]
    networks: [isolated, loopback-ingress]
  core-auth:
    image: public.ecr.aws/supabase/gotrue:v2.194.0
    depends_on:
      core-db: {condition: service_healthy}
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:58530/auth/v1
      GOTRUE_SITE_URL: ${APP_ORIGIN}
      GOTRUE_URI_ALLOW_LIST: ${APP_ORIGIN}/**,http://localhost:3110/**
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${DB_PASSWORD}@core-db:5432/postgres
      GOTRUE_JWT_SECRET: ${CORE_JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ISSUER: http://127.0.0.1:58530/auth/v1
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_MAILER_OTP_EXP: 3600
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: lab@arma2.local
      GOTRUE_SMTP_SENDER_NAME: Arma2 Core Lab
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 360000
      GOTRUE_MAILER_URLPATHS_MAGIC_LINK: http://127.0.0.1:58530/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: http://127.0.0.1:58530/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: http://127.0.0.1:58530/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: http://127.0.0.1:58530/auth/v1/verify
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: 10
      GOTRUE_LOG_LEVEL: error
    networks: [isolated]
  core-storage:
    image: public.ecr.aws/supabase/storage-api:v1.67.15
    depends_on:
      core-db: {condition: service_healthy}
    environment:
      ANON_KEY: ${CORE_ANON_KEY}
      SERVICE_KEY: ${CORE_SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${CORE_JWT_SECRET}
      PGRST_JWT_SECRET: ${CORE_JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${DB_PASSWORD}@core-db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
      STORAGE_PUBLIC_URL: http://127.0.0.1:58530/storage/v1
    volumes:
      - storage-data:/var/lib/storage
    networks: [isolated]
  core-rest:
    image: public.ecr.aws/supabase/postgrest:v14.15
    depends_on:
      core-db: {condition: service_healthy}
    environment:
      PGRST_DB_URI: postgres://authenticator:${DB_PASSWORD}@core-db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${CORE_JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_LOG_LEVEL: error
    networks: [isolated]
  core-realtime:
    image: public.ecr.aws/supabase/realtime:v2.113.4
    depends_on:
      core-db: {condition: service_healthy}
    environment:
      PORT: 4000
      DB_HOST: core-db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${CORE_JWT_SECRET}
      METRICS_JWT_SECRET: ${CORE_JWT_SECRET}
      SECRET_KEY_BASE: ${REALTIME_SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
    networks: [isolated]
  core-functions:
    image: public.ecr.aws/supabase/edge-runtime:v1.74.2
    command: [start, --main-service, /home/deno/main, --port, "9000"]
    depends_on: [core-db]
    environment:
      SUPABASE_URL: http://core-api:8000
      SUPABASE_SERVICE_ROLE_KEY: ${CORE_SERVICE_ROLE_KEY}
      SUPABASE_ANON_KEY: ${CORE_ANON_KEY}
      LAB_JWT_SECRET: ${CORE_JWT_SECRET}
    volumes:
      - ../../supabase/functions:/home/deno/functions:ro
      - ./edge-main:/home/deno/main:ro
      - deno-cache:/root/.cache/deno
    networks: [isolated, egress]
  core-api:
    image: node:22.22.0-bookworm-slim
    working_dir: /lab
    command: [node, core-api.mjs]
    depends_on: [core-rest, core-auth, core-storage, core-realtime, core-functions]
    environment:
      LAB_ALLOWED_ORIGINS: ${APP_ORIGIN},http://localhost:3110
      LAB_SLOW_PATHS: ${LAB_SLOW_PATHS:-}
    volumes:
      - ./core-api.mjs:/lab/core-api.mjs:ro
    ports: ["127.0.0.1:58530:8000"]
    networks: [isolated, loopback-ingress]
networks:
  isolated:
    internal: true
  loopback-ingress:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  egress:
    # core-functions only: Deno module resolution (esm.sh, deno.land).
    driver: bridge
volumes:
  core-data:
  storage-data:
  deno-cache:
