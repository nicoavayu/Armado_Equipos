name: arma2-core-contracts-phase3a
# Phase 3A end-to-end lab: REAL Core (schema at HEAD + the Phase 3A migration,
# real GoTrue sessions, real PostgREST, the real `torneos-core-contract` Edge
# Function on Supabase's edge-runtime) → Torneos server adapter → the UNCHANGED
# certified Torneos baseline behind PostgREST. Only the gateway is published,
# on loopback. Databases, Auth, REST and the Edge Function stay on an internal
# network. `core-functions` additionally gets outbound access solely so Deno can
# resolve the function's remote imports (esm.sh, deno.land), exactly as the
# hosted edge platform does; it publishes nothing.
services:
  core-db:
    image: public.ecr.aws/supabase/postgres:17.6.1.143
    command: [postgres, -D, /etc/postgresql, -c, log_statement=none, -c, log_min_error_statement=panic, -c, log_parameter_max_length_on_error=0]
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?generated by lab.mjs}
    volumes:
      - core-data:/var/lib/postgresql/data
      - ./core-init.sql:/docker-entrypoint-initdb.d/zz-phase3a.sql:ro
    networks: [isolated]
    healthcheck:
      test: [CMD, pg_isready, -U, postgres]
      interval: 2s
      timeout: 2s
      retries: 40
  torneos-db:
    image: public.ecr.aws/supabase/postgres:17.6.1.143
    command: [postgres, -D, /etc/postgresql, -c, log_statement=none, -c, log_min_error_statement=panic, -c, log_parameter_max_length_on_error=0]
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?generated by lab.mjs}
    volumes:
      - torneos-data:/var/lib/postgresql/data
    networks: [isolated]
    healthcheck:
      test: [CMD, pg_isready, -U, postgres]
      interval: 2s
      timeout: 2s
      retries: 40
  core-auth:
    image: public.ecr.aws/supabase/gotrue:v2.194.0
    depends_on:
      core-db: {condition: service_healthy}
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:58420/auth/v1
      GOTRUE_SITE_URL: http://127.0.0.1:58420
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${DB_PASSWORD}@core-db:5432/postgres
      GOTRUE_JWT_SECRET: ${CORE_JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ISSUER: http://127.0.0.1:58420/auth/v1
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_LOG_LEVEL: error
    networks: [isolated]
  core-rest:
    image: public.ecr.aws/supabase/postgrest:v14.15
    depends_on:
      core-db: {condition: service_healthy}
    environment:
      PGRST_DB_URI: postgres://authenticator:${DB_PASSWORD}@core-db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${CORE_JWT_SECRET}
      PGRST_JWT_AUD: authenticated
      PGRST_LOG_LEVEL: error
    networks: [isolated]
  # Kong substitute: the single origin the Edge Function's supabase-js client
  # talks to (/rest/v1 → PostgREST, /auth/v1 → GoTrue, /functions/v1 → edge-runtime).
  core-api:
    image: node:22.22.0-bookworm-slim
    working_dir: /lab
    command: [node, core-api.mjs]
    depends_on: [core-rest, core-auth]
    volumes:
      - ./core-api.mjs:/lab/core-api.mjs:ro
    networks: [isolated]
  core-functions:
    image: public.ecr.aws/supabase/edge-runtime:v1.74.2
    command: [start, --main-service, /home/deno/main, --port, "9000"]
    depends_on: [core-api]
    environment:
      SUPABASE_URL: http://core-api:8000
      SUPABASE_SERVICE_ROLE_KEY: ${CORE_SERVICE_ROLE_KEY}
      SUPABASE_ANON_KEY: ${CORE_ANON_KEY}
      TORNEOS_CONTRACT_SERVICE_SECRET: ${TORNEOS_CONTRACT_SERVICE_SECRET}
    volumes:
      - ../../supabase/functions:/home/deno/functions:ro
      - ./edge-main:/home/deno/main:ro
      - deno-cache:/root/.cache/deno
    networks: [isolated, egress]
  torneos-rest:
    image: public.ecr.aws/supabase/postgrest:v14.15
    depends_on:
      torneos-db: {condition: service_healthy}
    environment:
      PGRST_DB_URI: postgres://authenticator:${DB_PASSWORD}@torneos-db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: "@/keys/jwks.json"
      PGRST_JWT_AUD: arma2-torneos-local
      PGRST_DB_PRE_REQUEST: private.check_token
      PGRST_LOG_LEVEL: error
      PGRST_JWT_CACHE_MAX_LIFETIME: 0
    volumes:
      - ./.runtime/public:/keys:ro
    networks: [isolated]
  gateway:
    image: node:22.22.0-bookworm-slim
    working_dir: /lab
    command: [node, gateway.mjs]
    depends_on: [core-auth, core-api, torneos-rest]
    volumes:
      - ./gateway.mjs:/lab/gateway.mjs:ro
      - ./adapter.mjs:/lab/adapter.mjs:ro
      - ./core-client.mjs:/lab/core-client.mjs:ro
      - ../torneos-sso/token.mjs:/lab/token.mjs:ro
      - ../../backend/torneos/phase2a/schemas.json:/lab/schemas.json:ro
      - ./node_modules:/lab/node_modules:ro
      - ./.runtime/server:/lab/.runtime/server:ro
    ports: ["127.0.0.1:58420:58420"]
    networks: [isolated, loopback-ingress]
networks:
  isolated:
    internal: true
  loopback-ingress:
    # Docker 29 does not publish ports for an internal-only container.
    # Gateway-only; no masquerade, so nothing on it can reach the outside.
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  egress:
    # core-functions only: outbound module resolution for the Deno runtime.
    driver: bridge
volumes:
  core-data:
  torneos-data:
  deno-cache:
