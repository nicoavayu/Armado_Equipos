# BRANDING-V1 overlay (compose -f compose.yaml -f compose.branding.yaml), selected by TORNEOS_BRANDING_MODE=on in
# lab.mjs. Local only. Adds what the hosted Torneos project already has and the base lab does not: Supabase Storage on
# the isolated Torneos database, so logos and shields can be stored and served in the hybrid composition.
#   * torneos-storage: the real storage-api. It verifies the bridge's RS256 tokens through JWT_JWKS (hosted: the
#     project's Third-Party Auth with the same JWKS) and the lab anon key through AUTH_JWT_SECRET; storage RLS runs
#     the baseline's own private.current_identity_id() / can_write_tournament_branding_object. Its env file is
#     generated by lab.mjs (.runtime/torneos-storage.env, 0600). The loopback port only serves the signed URLs the
#     browser loads (hosted: https://<ref>.supabase.co/storage/v1); nothing else reaches it from the host.
#   * Both gateways get TORNEOS_BRANDING_MODE=on plus the internal storage URL and the public base of signed URLs.
services:
  torneos-storage:
    image: public.ecr.aws/supabase/storage-api:v1.67.15
    depends_on:
      torneos-db: {condition: service_healthy}
    env_file: [.runtime/torneos-storage.env]
    environment:
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      FILE_SIZE_LIMIT: "2097152"
      UPLOAD_FILE_SIZE_LIMIT: "2097152"
      TENANT_ID: torneos-lab
      REGION: local
      GLOBAL_S3_BUCKET: torneos-lab
      ENABLE_IMAGE_TRANSFORMATION: "false"
      DB_MIGRATIONS_FREEZE_AT: ""
    volumes:
      - torneos-storage-data:/var/lib/storage
    ports: ["127.0.0.1:58425:5000"]
    networks: [isolated, loopback-ingress]
  gateway:
    environment:
      TORNEOS_BRANDING_MODE: "on"
      TORNEOS_STORAGE_URL: http://torneos-storage:5000
      TORNEOS_STORAGE_PUBLIC_URL: http://127.0.0.1:58425
    volumes:
      - ../../backend/torneos/supabase/functions/torneos-gateway/branding.ts:/lab/functions/torneos-gateway/branding.ts:ro
      - ../../backend/torneos/supabase/functions/torneos-gateway/branding-v1-rpc-allowlist.json:/lab/functions/torneos-gateway/branding-v1-rpc-allowlist.json:ro
  torneos-functions:
    depends_on: [core-auth, core-api, torneos-rest, torneos-storage]

volumes:
  torneos-storage-data:
