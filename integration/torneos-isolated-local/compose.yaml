name: arma2-torneos-isolated-local
# Phase 3B — R2 LOCAL: the ISOLATED Torneos non-production stack (hybrid architecture:
# Core staging stays REMOTE, Torneos runs here). One database with the certified Phase 2C/2D
# baseline + the staging v1 RPC exposure gate, behind PostgREST on loopback. There is NO Core
# service in this file by construction: no core-db, no GoTrue, no Core API — nothing to reach
# DB-to-DB. The database and PostgREST live on an internal network (no egress); PostgREST is
# additionally on a masquerade-less bridge only so Docker publishes its loopback port.
# `torneos-functions` (the Edge gateway, profile `gateway`) is for R4 and does not start in R2.
services:
  torneos-db:
    image: public.ecr.aws/supabase/postgres:17.6.1.143
    command: [postgres, -D, /etc/postgresql, -c, log_statement=none, -c, log_min_error_statement=panic, -c, log_parameter_max_length_on_error=0]
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?generated by lab.mjs}
    volumes:
      - torneos-data:/var/lib/postgresql/data
    networks: [isolated]
    labels:
      arma2.phase: 3b-local-torneos
    healthcheck:
      test: [CMD, pg_isready, -U, postgres]
      interval: 2s
      timeout: 2s
      retries: 40
  torneos-rest:
    image: public.ecr.aws/supabase/postgrest:v14.15
    depends_on:
      torneos-db: {condition: service_healthy}
    environment:
      PGRST_DB_URI: postgres://authenticator:${DB_PASSWORD}@torneos-db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: "@/keys/jwks.json"
      PGRST_JWT_AUD: arma2-torneos-local
      PGRST_LOG_LEVEL: error
      PGRST_JWT_CACHE_MAX_LIFETIME: 0
      # No PGRST_DB_PRE_REQUEST here on purpose: the pre-request hook comes from the database
      # (`alter role authenticator set pgrst.db_pre_request`), the same form the remote runner uses.
    volumes:
      - ./.runtime/public:/keys:ro
    ports: ["127.0.0.1:58430:3000"]
    networks: [isolated, loopback-ingress]
    labels:
      arma2.phase: 3b-local-torneos
  torneos-functions:
    # R4 only (`--profile gateway`): the certified Edge gateway (backend/torneos/supabase/functions/
    # torneos-gateway) hosted by the real edge-runtime, talking to torneos-rest here and to the
    # REMOTE Core contract over HTTPS. `egress` is attached to this service only.
    profiles: [gateway]
    image: public.ecr.aws/supabase/edge-runtime:v1.74.2
    command: [start, --main-service, /home/deno/main, --port, "9000"]
    depends_on: [torneos-rest]
    env_file:
      - path: .runtime/torneos-gateway.env
        required: false
    volumes:
      - ../../backend/torneos/supabase/functions:/home/deno/functions:ro
      - ../torneos-core-contracts/torneos-edge-main:/home/deno/main:ro
      - torneos-deno-cache:/root/.cache/deno
    ports: ["127.0.0.1:58431:9000"]
    networks: [isolated, egress]
    labels:
      arma2.phase: 3b-local-torneos
networks:
  isolated:
    internal: true
  loopback-ingress:
    # Docker 29 does not publish ports for an internal-only container. PostgREST only;
    # no masquerade, so nothing on it can reach the outside.
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  egress:
    # torneos-functions only (R4): HTTPS to the Core contract and Deno module resolution.
    driver: bridge
volumes:
  torneos-data:
  torneos-deno-cache:
