name: arma2-sso-phase15
services:
  core-db:
    image: public.ecr.aws/supabase/postgres:17.6.1.143
    command: [postgres, -D, /etc/postgresql, -c, log_statement=none, -c, log_min_error_statement=panic, -c, log_parameter_max_length_on_error=0]
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?generated by lab.mjs}
    volumes:
      - core-data:/var/lib/postgresql/data
      - ./core-init.sql:/docker-entrypoint-initdb.d/zz-poc.sql:ro
    networks: [isolated]
    healthcheck:
      test: [CMD, pg_isready, -U, postgres]
      interval: 2s
      timeout: 2s
      retries: 40
  torneos-db:
    image: public.ecr.aws/supabase/postgres:17.6.1.143
    command: [postgres, -D, /etc/postgresql, -c, log_statement=none, -c, log_min_error_statement=panic, -c, log_parameter_max_length_on_error=0]
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?generated by lab.mjs}
    volumes:
      - torneos-data:/var/lib/postgresql/data
      - ./torneos.sql:/docker-entrypoint-initdb.d/zz-poc.sql:ro
    networks: [isolated]
    healthcheck:
      test: [CMD, pg_isready, -U, postgres]
      interval: 2s
      timeout: 2s
      retries: 40
  core-auth:
    image: public.ecr.aws/supabase/gotrue:v2.194.0
    depends_on:
      core-db: {condition: service_healthy}
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:58410/auth/v1
      GOTRUE_SITE_URL: http://127.0.0.1:58410
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${DB_PASSWORD}@core-db:5432/postgres
      GOTRUE_JWT_SECRET: ${CORE_JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ISSUER: http://127.0.0.1:58410/auth/v1
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_LOG_LEVEL: error
    networks: [isolated]
  core-rest:
    image: public.ecr.aws/supabase/postgrest:v14.15
    depends_on:
      core-db: {condition: service_healthy}
    environment:
      PGRST_DB_URI: postgres://authenticator:${DB_PASSWORD}@core-db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${CORE_JWT_SECRET}
      PGRST_JWT_AUD: authenticated
      PGRST_LOG_LEVEL: error
    networks: [isolated]
  torneos-rest:
    image: public.ecr.aws/supabase/postgrest:v14.15
    depends_on:
      torneos-db: {condition: service_healthy}
    environment:
      PGRST_DB_URI: postgres://authenticator:${DB_PASSWORD}@torneos-db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: "@/keys/jwks.json"
      PGRST_JWT_AUD: arma2-torneos-local
      PGRST_DB_PRE_REQUEST: private.check_token
      PGRST_LOG_LEVEL: error
      PGRST_JWT_CACHE_MAX_LIFETIME: 0
    volumes:
      - ./.runtime/public:/keys:ro
    networks: [isolated]
  gateway:
    image: node:22.22.0-bookworm-slim
    working_dir: /poc
    command: [node, server.mjs]
    depends_on: [core-auth, torneos-rest]
    volumes:
      - ./server.mjs:/poc/server.mjs:ro
      - ./token.mjs:/poc/token.mjs:ro
      - ./node_modules:/poc/node_modules:ro
      - ./dist:/poc/dist:ro
      - ./.runtime/server:/poc/.runtime/server:ro
    ports: ["127.0.0.1:58410:58410"]
    networks: [isolated, loopback-ingress]
networks:
  isolated:
    internal: true
  loopback-ingress:
    # Docker 29 does not publish ports for an internal-only container.
    # This network is gateway-only; database/Auth/REST stay on isolated.
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
volumes:
  core-data:
  torneos-data:
