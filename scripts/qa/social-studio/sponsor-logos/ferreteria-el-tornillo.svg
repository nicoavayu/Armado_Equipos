<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
  <!-- Fictional brand (QA fixture). Transparent background, dark ink + one accent. Fonts: Oswald (Google Fonts). -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&amp;display=block');
    .kicker { font: 500 58px Oswald, 'Arial Narrow', sans-serif; letter-spacing: 15px; fill: #1F2328; }
    .word { font: 700 138px Oswald, 'Arial Narrow', sans-serif; letter-spacing: 2px; fill: #1F2328; }
  </style>
  <g transform="translate(205 220)">
    <polygon points="0,-178 154,-89 154,89 0,178 -154,89 -154,-89" fill="#1F2328"/>
    <polygon points="0,-142 123,-71 123,71 0,142 -123,71 -123,-71" fill="none" stroke="#F2EFEA" stroke-width="10" opacity="0.18"/>
    <circle r="72" fill="#E2572B"/>
    <circle r="40" fill="#1F2328"/>
    <g stroke="#E2572B" stroke-width="12" stroke-linecap="round">
      <line x1="-30" y1="-8" x2="30" y2="-22"/>
      <line x1="-30" y1="18" x2="30" y2="4"/>
    </g>
  </g>
  <text class="kicker" x="430" y="138">FERRETERÍA</text>
  <text class="word" x="424" y="300">EL TORNILLO</text>
  <rect x="432" y="330" width="250" height="18" fill="#E2572B"/>
  <rect x="700" y="330" width="420" height="18" fill="#1F2328"/>
</svg>
