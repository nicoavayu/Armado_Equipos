<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <!-- Fictional brand (QA fixture). Coloured background (the logo carries its own field). Fonts: Bodoni Moda, Libre Franklin. -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@1,700&amp;family=Libre+Franklin:wght@600&amp;display=block');
    .word { font: italic 700 146px 'Bodoni Moda', Georgia, serif; fill: #FFF4DC; }
    .kicker { font: 600 46px 'Libre Franklin', Arial, sans-serif; letter-spacing: 12px; fill: #FFE3A8; }
  </style>
  <rect width="1200" height="640" rx="64" fill="#B4541F"/>
  <rect x="26" y="26" width="1148" height="588" rx="44" fill="none" stroke="#FFE3A8" stroke-width="6" opacity="0.7"/>
  <g transform="translate(250 330) rotate(-14)" fill="#FFF4DC">
    <path d="M -7 -10 Q 0 150 -6 230 L 7 230 Q 13 150 7 -10 Z"/>
    <ellipse cx="0" cy="-190" rx="26" ry="44"/>
    <g id="pair">
      <ellipse cx="-38" cy="-140" rx="24" ry="44" transform="rotate(-28 -38 -140)"/>
      <ellipse cx="38" cy="-140" rx="24" ry="44" transform="rotate(28 38 -140)"/>
    </g>
    <use href="#pair" y="62"/>
    <use href="#pair" y="124"/>
    <use href="#pair" y="186"/>
    <path d="M 0 -236 L 0 -300" stroke="#FFF4DC" stroke-width="6" stroke-linecap="round"/>
    <path d="M -22 -228 L -50 -288" stroke="#FFF4DC" stroke-width="6" stroke-linecap="round"/>
    <path d="M 22 -228 L 50 -288" stroke="#FFF4DC" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text class="kicker" x="450" y="232">PANADERÍA</text>
  <text class="word" x="440" y="410">La Espiga</text>
  <text class="kicker" x="452" y="500" style="font-size:34px;letter-spacing:9px;fill:#FFE3A8">MASA MADRE · DESDE 1987</text>
</svg>
